<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
   <header class="header">
    
        <h1>Akan Name Generator</h1>
        <p>Enter your birthdate and gender to find your Akan name.</p>
    
   </header>

        <form id="akanForm">
            <label>Day:</label><br>
            <input type="number" id="day" required><br>

            <label>Month:</label><br>
            <input type="number" id="month" required><br>

            <label>Year:</label><br>
            <input type="number" id="year" required><br>

            <label>Gender:</label><br>
            <select id="gender" required>
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select><br>

            <button type="submit" id="submit-button">Generate Name</button>
        </form>
        <!-- generated name -->
        <h2 id="result">Akan name:</h2>
 </div>

    <script src="script.js"></script>
</body>
</html>
