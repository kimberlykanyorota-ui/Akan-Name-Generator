<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header -->
    <header>
        <h1>Akan Name Generator</h1>
        <h1 id="name">Find your Akan name</h1>
    </header>
    
    <!-- form -->
     <h3 id="description">Enter your details to discover your Akan name</h3>
     <form action="">
        <label for="birthday">Date of Birth:</label><br>
            <input type="date" id="birthday" name="birthday"><br><br>
        <label for="gender">Gender:</label><br>
            <input type="text" id="gender" name="gender"><br><br>
            <button type="submit" id="submit-button">Generate</button>

     </form>
    
    <script src="script.js" defer></script>    
</body>
</html>
